name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install step: the package has no dependencies.
      - run: npm test
      - run: npm run check-docs-sync
      # The site's figures come from the studies. Without this step a stale
      # docs/site-data.js only fails on the author's machine, which is where it
      # is least likely to be noticed.
      - run: npm run check-site-data
      - run: node scripts/studies-index.mjs --check
